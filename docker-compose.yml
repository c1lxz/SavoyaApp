services:
  db:
    image: postgres:16
    container_name: savoya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gate_app
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gate_app"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: savoya_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/gate_app
      SECRET_KEY: change-me-in-prod
      DEBUG: "false"
      GATE_REAL_INTEGRATION_ENABLED: "false"
      CLEANUP_INTERVAL_SECONDS: "60"
      ALLOWED_HOSTS_JSON: '["xn--80aaachc8cmu1au8c1f.xn--p1ai","localhost","127.0.0.1","testserver"]'
      CORS_ALLOW_ORIGINS_JSON: '["http://xn--80aaachc8cmu1au8c1f.xn--p1ai","https://xn--80aaachc8cmu1au8c1f.xn--p1ai","http://localhost","http://127.0.0.1","http://localhost:80","http://127.0.0.1:80"]'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: savoya_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pg_data:
