services:
  db:
    image: postgres:16
    container_name: savoya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-savoya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gate_app}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savoya} -d ${POSTGRES_DB:-gate_app}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: savoya_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-false}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      GATE_REAL_INTEGRATION_ENABLED: ${GATE_REAL_INTEGRATION_ENABLED:-false}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-60}
      ALLOWED_HOSTS_JSON: ${ALLOWED_HOSTS_JSON:?Set ALLOWED_HOSTS_JSON in .env}
      CORS_ALLOW_ORIGINS_JSON: ${CORS_ALLOW_ORIGINS_JSON:?Set CORS_ALLOW_ORIGINS_JSON in .env}
      BOOTSTRAP_DEMO_USER: ${BOOTSTRAP_DEMO_USER:-false}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: savoya_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certificate.fullchain.crt:/etc/nginx/certs/certificate.fullchain.crt:ro
      - ./certificate.key:/etc/nginx/certs/certificate.key:ro

volumes:
  pg_data:
