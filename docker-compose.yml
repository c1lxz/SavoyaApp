services:
  db:
    image: postgres:16
    container_name: savoya_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gate_app
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d gate_app"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: savoya_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/gate_app
      SECRET_KEY: change-me-in-prod
      DEBUG: "false"
      GATE_REAL_INTEGRATION_ENABLED: "false"
      CLEANUP_INTERVAL_SECONDS: "60"
    ports:
      - "8000:8000"

volumes:
  pg_data:
